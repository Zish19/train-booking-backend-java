spring.application.name=train-reservation-api

# SQL Database Configuration (H2 SQL engine)
spring.datasource.url=jdbc:h2:mem:traindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate SQL configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 SQL Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
